<!-- Static top navbar — sits at the top of every page in document flow.
     Scrolls away with the page; the floating pill takes over after 80vh. -->
<nav class="static-nav" aria-label="Hauptnavigation">
  <div class="sn-inner">
    <a routerLink="/" class="sn-brand">
      <img src="/logo.png" alt="Gehrke Studio" class="sn-logo" />
      <span>Gehrke<strong>&nbsp;Studio</strong></span>
    </a>
    <div class="sn-links">
      <a routerLink="/projekte"  routerLinkActive="is-active">Projekte</a>
      <a routerLink="/leistungen" routerLinkActive="is-active">Leistungen</a>
      <a routerLink="/ueber-uns"  routerLinkActive="is-active">Über uns</a>
      <a routerLink="/blog"       routerLinkActive="is-active">Blog</a>
      <a routerLink="/kontakt"    routerLinkActive="is-active">Kontakt</a>
    </div>
    <a routerLink="/demo" class="sn-cta">
      Vorlage anfordern
      <svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
    </a>
  </div>
</nav>

<!-- Floating sticky pill navbar -->
<nav class="floating-nav" [class.is-visible]="visible()" aria-label="Hauptnavigation">
  <a routerLink="/" class="fn-brand">
    <img src="/logo.png" alt="Gehrke Studio" class="fn-logo" />
    <span class="word">
      <span class="char" style="transition-delay:.20s">G</span>
      <span class="char" style="transition-delay:.23s">e</span>
      <span class="char" style="transition-delay:.26s">h</span>
      <span class="char" style="transition-delay:.29s">r</span>
      <span class="char" style="transition-delay:.32s">k</span>
      <span class="char" style="transition-delay:.35s">e</span>
    </span>
    <span class="word">
      <span class="char" style="transition-delay:.38s">S</span>
      <span class="char" style="transition-delay:.41s">t</span>
      <span class="char" style="transition-delay:.44s">u</span>
      <span class="char" style="transition-delay:.47s">d</span>
      <span class="char" style="transition-delay:.50s">i</span>
      <span class="char" style="transition-delay:.53s">o</span>
    </span>
  </a>
  <span class="fn-sep"></span>
  <div class="fn-links">
    <a routerLink="/projekte"  routerLinkActive="is-active">Projekte</a>
    <a routerLink="/leistungen" routerLinkActive="is-active">Leistungen</a>
    <a routerLink="/ueber-uns"  routerLinkActive="is-active">Über uns</a>
    <a routerLink="/blog"       routerLinkActive="is-active">Blog</a>
    <a routerLink="/kontakt"    routerLinkActive="is-active">Kontakt</a>
  </div>
  <a routerLink="/demo" class="fn-cta">
    Vorlage anfordern
    <svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
  </a>
</nav>
